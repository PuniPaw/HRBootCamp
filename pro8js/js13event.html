<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트</title>
    <script>
        function func1(){
            document.getElementById("show").innerHTML = "<i>전통적인 이벤트 처리</i>"
        }

        let a = 10;
        let b = {
            funcNew1:function(){
                document.getElementById("show").innerHTML = "b 객체의 메소드 처리";
            },
            funcNew2:function(){
                document.getElementById("show").innerHTML = "<h1>b객체의 멤버 처리</h1>";
            }
        }
    </script>

    <script>
        // window.onload : 
        // HTML 문서와 이미지, CSS 같은 페이지 리소스가 모두 로딩된 후 자동 발생 이벤트
        // window.onload = alert("ok");
        window.onload = function(){  // 이름이 없는 함수 -  1회용으로 사용
            // alert("good");
            const exBtn1 = document.getElementById("btn1"); // 특정 id를 가진 버튼을 읽어 변수에 저장
            /*
            exBtn1.onclick = function(){   // 이벤트 장착
                document.getElementById("show").innerHTML = "클릭1 선택";
            }
            */
            exBtn1.onclick = bt1Func;   // 함수 호출

            const exBtn2 = document.getElementsByName("myBtn")  // name 지적. 중복이 가능하므로 배열에 기억
            console.log(exBtn2.length);
            exBtn2[0].onclick = function(){
                document.getElementById("show").innerHTML = "클릭2 누름";
            }
            exBtn2[1].onclick = function(){
                document.getElementById("show").innerHTML = "<h2>클릭3을 누르다니</h2>";
            }

            const exBtn4 = document.getElementsByTagName("button")[3];  // tag명 지적.
            exBtn4.onclick = function(){
                document.getElementById("show").innerHTML = "클릭4 선택 선택</h2>";
            }

            // 이벤트 연결 및 해제
            // addEveventListener("이벤트종류", 핸들러함수)
            document.getElementById("btn5").addEventListener("click", abcFunc);  // 이벤트 연결
        }

        function bt1Func(){
            document.getElementById("show").innerHTML = "클릭1 선택 와우";
        }

        function abcFunc(){
            // alert("abc");
            document.getElementById("show").innerHTML = "클릭5 이벤트 연결 처리";

            document.getElementById("btn5").removeEventListener("click", abcFunc)  // 이벤트 해제
        }
    </script>
</head>
<body>
<h2>이벤트 처리 : 이벤트 핸들러 연결</h2>
<input type="button" value="버튼1" onclick="func1()"><br>
<input type="button" value="버튼2" onclick="b.funcNew1()"><br>
<input type="button" value="버튼3" onclick="b.funcNew2()"><br>
<hr>
<!--
<button id="btn1" onclick="이벤트처리함수()">라벨</button>    이건 html 내에 js를 기술. w3c는 비권장
-->
<button id="btn1">클릭1</button><br>
<button id="btn2" name="myBtn">클릭2</button><br>
<button id="btn3" name="myBtn">클릭3</button><br>
<button id="btn4">클릭4</button><br>
<button id="btn5">클릭5</button><br> 

<div id="show"></div>
</body>
</html>
